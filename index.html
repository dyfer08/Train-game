<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Train Grid</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game">
    <header class="hud-top">
      <p class="hud-label">Défi du jour</p>
      <div class="hud-icons">
        <span class="hud-badge">1</span>
        <span class="hud-pin" aria-hidden="true">◎</span>
      </div>
    </header>

    <main class="stage">
      <canvas id="canvas" aria-label="Carte ferroviaire"></canvas>
    </main>

    <footer class="hud-bottom">
      <h1 class="city-name">Paris</h1>
      <div class="city-line"></div>
      <p class="city-score" id="score">0</p>
    </footer>
  </div>

  <script src="js/grid.js"></script>
  <script src="js/rails.js"></script>
  <script src="js/trains.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
